name: Build APK from zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o sntg-app.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        working-directory: project
        run: npm install

      - name: Capacitor sync
        working-directory: project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x project/android/gradlew

      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sntg-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Expand project into repo (one-time migration)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f sntg-app.zip
          rm -rf project/.github
          cp -r project/. .
          rm -rf project
          git add -A
          git diff --cached --quiet || git commit -m "Expand project files (auto) [skip ci]"
          git push
